name: CI

on:
  push:
  pull_request:

jobs:
  python-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install quality tools
        run: python -m pip install ruff
      - name: Ruff lint
        run: ruff check .
      - name: Ruff format check
        run: ruff format --check .
      - name: Compile Python files
        run: python -m py_compile crypto_lab.py bybit_public.py download_bybit_csv.py paper_bybit.py backtest_bybit_paper.py dashboard.py sweep_bybit_params.py agent_healthcheck.py
      - name: Generate dashboard from empty state
        run: python dashboard.py --state paper_state/missing.json --output dashboard.html
      - name: Agent healthcheck
        run: python agent_healthcheck.py --state paper_state/missing.json --backtest runs/missing.json --dashboard dashboard.html --skip-ruff
